<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFIXIFY - Update Required</title>
    <style>
        body {
            background-color: #060907;
            color: #eafff0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(10, 20, 14, 0.88);
            border: 1px solid rgba(46, 230, 166, 0.25);
            border-radius: 20px;
            padding: 30px 20px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 0 30px rgba(46, 230, 166, 0.15);
        }
        .btn-download {
            background: linear-gradient(135deg, #2ee6a6, #22d3d3);
            color: #060907;
            padding: 16px 24px;
            border-radius: 14px;
            font-weight: 800;
            text-decoration: none;
            display: block;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(46, 230, 166, 0.3);
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <div style="font-size: 3.5rem; margin-bottom: 12px;">🚀</div>
        <h2 style="font-weight: 800; margin-bottom: 8px; font-size: 1.5rem; color: #2ee6a6;">New Version v2.0 Required</h2>
        <p style="color: #8fb89c; font-size: 0.88rem; line-height: 1.5; margin-bottom: 20px;">
            Aapka app version purana ho chuka hai. Naya update download karne ke liye niche diye gaye button par click karein.
        </p>
        
        <!-- Direct APK Download Link -->
        <a href="https://github.com/infixify/infixify-releases/releases/download/v1.3/INFIXIFY.ESPORTS_1.2.apk" class="btn-download" id="downloadBtn">
            Download Latest APK (v2.0)
        </a>
    </div>

    <script>
        // Automatic trigger: Agar user WebView me hai, toh try karo ki link external browser me khule
        window.addEventListener('DOMContentLoaded', () => {
            const apkUrl = "https://github.com/infixify/infixify-releases/releases/download/v1.3/INFIXIFY.ESPORTS_1.2.apk";
            
            // Kuch seconds baad automatic download bhi trigger karne ki koshish
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = apkUrl;
                a.setAttribute('download', 'INFIXIFY_v2.0.apk');
                document.body.appendChild(a);
                // a.click(); // Optional: Agar automatic download trigger karwana ho
            }, 1500);
        });
    </script>

</body>
</html>
